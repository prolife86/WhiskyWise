version: '3.8'

services:
  whiskywise:
    build: .
    container_name: whiskywise
    ports:
      - "5000:5000"
    volumes:
      - whiskywise_data:/data
    environment:
# REQUIRED: Change this before starting the container.
# This key signs all user sessions — anyone who knows it can forge a valid
# session cookie and log in as any user without a password. A random 32-byte
# hex string works well:  python3 -c "import secrets; print(secrets.token_hex(32))"
# If you leave this placeholder in place, the app will generate a random key
# at startup instead, which means every container restart logs everyone out.
      - SECRET_KEY=change-this-to-a-long-random-secret
      - DATABASE_PATH=/data/db/whiskywise.db
      - UPLOAD_FOLDER=/data/uploads
# HTTPS / secure cookies:
# SESSION_COOKIE_SECURE and REMEMBER_COOKIE_SECURE are intentionally NOT set
# here because this container is often deployed on a local network without TLS.
# If you place WhiskyWise behind a reverse proxy that terminates HTTPS (e.g.
# nginx, Caddy, or a Home Assistant ingress), you should add:
#   - SESSION_COOKIE_SECURE=true
#   - REMEMBER_COOKIE_SECURE=true
# Without these flags, session cookies can be transmitted over plain HTTP,
# which is acceptable on a trusted LAN but a risk on any internet-facing setup.
    restart: unless-stopped

volumes:
  whiskywise_data:
    driver: local
