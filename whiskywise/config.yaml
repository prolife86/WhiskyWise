name: "WhiskyWise"
description: "Your personal spirits guide — tasting journal, collection management & wishlist."
# NOTE: This field is managed automatically by the GitHub Actions sync-version job.
# Do not edit it by hand — it will be overwritten on the next release.
version: "1.5.5"
slug: "whiskywise"
init: false
arch:
  - aarch64
  - amd64
startup: application
boot: auto
ports:
  5000/tcp: 5000
ports_description:
  5000/tcp: "WhiskyWise Web UI"
webui: http://[HOST]:[PORT:5000]
options:
  secret_key: "change-this-to-a-long-random-secret"
schema:
  secret_key: str
url: "https://github.com/prolife86/WhiskyWise"
