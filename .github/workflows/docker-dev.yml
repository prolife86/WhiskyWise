name: Docker — dev build
# Manual test/dev build. Builds and pushes a :dev image to GHCR and Docker Hub.
# Does NOT create a GitHub Release, does NOT create or move any tag, does NOT
# touch whiskywise/config.yaml, and does NOT run the sync-version commit step.
#
# Use this when you want to test a branch in a real container before releasing.
#
# How to trigger:
#   GitHub → Actions → "Docker — dev build" → Run workflow → pick your branch.
#
# The image is tagged :dev (always overwritten) and optionally :dev-<sha>.
# On main the :latest tag is NOT touched — only :dev.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from (leave blank to use current)'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-dev:
    name: Build & push :dev image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch || github.ref }}

      - name: Derive short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Lowercase repository
        id: repo
        run: |
          echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push :dev image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.repo }}:dev
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.repo }}:dev-${{ steps.sha.outputs.short }}
            ${{ secrets.DOCKERHUB_USERNAME }}/whiskywise:dev
            ${{ secrets.DOCKERHUB_USERNAME }}/whiskywise:dev-${{ steps.sha.outputs.short }}
          build-args: |
            APP_VERSION=dev-${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Dev build complete 🛠" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Branch:** \`${{ inputs.branch || github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**SHA:** \`${{ steps.sha.outputs.short }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull ${{ env.REGISTRY }}/${{ steps.repo.outputs.repo }}:dev" >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/whiskywise:dev" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> ⚠️ This is a dev image — not a release. No tag was created." >> "$GITHUB_STEP_SUMMARY"
```
